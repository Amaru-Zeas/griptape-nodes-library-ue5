[project]
name = "griptape-nodes-library-flow-denoise"
version = "0.1.0"
description = "GTN Flow Denoise library based on ComfyUI-FlowDenoise temporal denoising"
authors = [
    { name = "Griptape Community" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "av",
    "opencv-python-headless",
    "torch",
    "torchvision",
    "tqdm",
    "memfof @ git+https://github.com/msu-video-group/memfof.git"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
