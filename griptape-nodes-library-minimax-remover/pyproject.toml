[project]
name = "griptape-nodes-library-minimax-remover"
version = "0.4.0"
description = "GTN MiniMax Remover library with MiniMax, VOID, and mask helper nodes"
authors = [
    { name = "Griptape Community" }
]
requires-python = ">=3.11"
dependencies = [
    "imageio[ffmpeg]>=2.37.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
